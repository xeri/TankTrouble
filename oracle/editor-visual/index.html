<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>maze editor visual gate</title>
<style>body{margin:0}</style>
<script src="../ruffle-spike/ruffle/ruffle.js"></script>
</head>
<body>
<div id="swfhost" style="width:688px;height:400px"></div>
<script>
window.__gate = {};
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden',
                               allowScriptAccess: true, logLevel: 'warn' };
window.addEventListener('load', function () {
  var qs = new URLSearchParams(location.search);
  var swf = qs.get('swf') || 'harness.swf';
  var init = qs.get('initCode');
  // Flash resolves LoadVars-relative URLs against the SWF, Ruffle against
  // the page -- point Ruffle's base at the SWF's directory to match
  var dir = swf.slice(0, swf.lastIndexOf('/') + 1);
  if (dir) window.RufflePlayer.config.base = dir;
  var player = window.RufflePlayer.newest().createPlayer();
  window.__player = player;
  player.style.width = '688px'; player.style.height = '400px';
  document.getElementById('swfhost').appendChild(player);
  player.load(init ? swf + '?initCode=' + encodeURIComponent(init) : swf)
    .then(function () { window.__gate.loaded = true; })
    .catch(function (e) { window.__gate.loadfail = String(e); });
});
</script>
</body>
</html>
