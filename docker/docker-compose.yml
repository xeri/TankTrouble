# Validated 2026-08-03: mysql:5.5 executed all init SQL cleanly (row counts
# + byte round-trips green), php serves O bytes byte-identically, stubs 501.
# PHP 5.6 / MySQL 5.5 are intentionally obsolete (period fidelity).
# NEVER expose beyond 127.0.0.1. See ../SECURITY.md.
services:
  php:
    build: ./php
    platform: linux/amd64
    ports:
      - "127.0.0.1:8056:80"
    volumes:
      - ../srv:/var/www/html
    depends_on:
      - mysql
    environment:
      TT_DB_HOST: mysql
      TT_DB_NAME: tanktrouble
      TT_DB_USER: ${TT_DB_USER}
      TT_DB_PASSWORD: ${TT_DB_PASSWORD}
  mysql:
    image: mysql:5.5
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tanktrouble
      MYSQL_USER: ${TT_DB_USER}
      MYSQL_PASSWORD: ${TT_DB_PASSWORD}
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
    # no host port published — reachable on the compose network only
